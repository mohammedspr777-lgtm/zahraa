<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زوزوزوزوزوزو </title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: red;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
        }

        h1 {
            color: #00ffff;
            font-size: 44px;
        }

        p {
            color: #00ffff;
            font-size: 18px;
        }

        button {
            padding: 14px 28px;
            margin-top: 15px;
            background: #00ffff;
            color: #141e30;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: white;
            transform: scale(1.1);
            box-shadow: 0 0 20px #00ffff;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            color: #00ffff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>زهراء صبر صالح🚀</h1>
        <p>زهراء صبر صالح الصينيه </p>

        <button onclick="changeMessage()">دوس هنا</button>

        <div id="message"></div>
    </div>

    <script>
        function changeMessage() {
            document.getElementById("message").innerHTML =
                "ها قندرة";
        }
    </script>

</body>
</html>
